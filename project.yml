name: Musset
options:
  bundleIdPrefix: app.musset
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  libgit2:
    # libgit2 built from source by SwiftPM (HTTPS through SecureTransport, SSH through /usr/bin/ssh):
    # no git on the Mac needed, and push/pull to a server later.
    url: https://github.com/ibrahimcetin/libgit2
    exactVersion: 1.9.2
  Sparkle:
    # Updates outside the App Store: the feed is musset.app/appcast.xml, each release signed with the project's key.
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
  MussetPage:
    # The reading engine (Packages/MussetPage, on musset-typeset): build it first with scripts/build-typeset.sh.
    path: Packages/MussetPage
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: NO
targets:
  Musset:
    type: application
    # Signing: ad hoc unless a Local.xcconfig (not in git) names a team and a certificate.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    platform: macOS
    sources:
      - path: Musset
      - path: Shared
    dependencies:
      - package: libgit2
      - package: MussetPage
      - package: Sparkle
    info:
      path: Musset/Info.plist
      properties:
        CFBundleDisplayName: Musset
        CFBundleURLTypes:
          - CFBundleURLName: app.musset.Musset
            CFBundleURLSchemes: [musset]
        LSApplicationCategoryType: public.app-category.productivity
        SUFeedURL: https://musset.app/appcast.xml
        SUPublicEDKey: phx1JTsVOh5nH2GAoIAtphMlSX0nu2a+wUfBQT44/YM=  # gitleaks:allow — a public key, safe to publish
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.musset.Musset
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Bundle pandoc
        basedOnDependencyAnalysis: false
        script: |
          # Ship pandoc inside the app for DOCX/EPUB export and .docx import: the official release,
          # checked against its SHA-256 and Developer ID signature (scripts/fetch-pandoc.sh).
          if P="$("$SRCROOT/scripts/fetch-pandoc.sh" $ARCHS)"; then
            mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/bin"
            cp -f "$P" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/bin/pandoc"
          else
            echo "warning: pandoc could not be downloaded; DOCX/EPUB export will look for it on PATH"
          fi
      - name: Bundle LanguageTool
        basedOnDependencyAnalysis: false
        script: |
          # Spelling and grammar in Musset's six languages, on this Mac: LanguageTool trimmed to them, with a small
          # Java runtime, both checked against their SHA-256 (scripts/fetch-languagetool.sh).
          if B="$("$SRCROOT/scripts/fetch-languagetool.sh" $ARCHS)"; then
            D="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/LanguageTool"
            mkdir -p "$D"
            rsync -a --delete "$B/" "$D/"
          else
            echo "warning: LanguageTool could not be prepared; proofreading will be off"
          fi
  MussetReader:
    # Musset Reader for iPhone and iPad: free, reading and annotating the books shared with you. No purchase inside.
    type: application
    platform: iOS
    # Signing as for the Mac app: ad hoc by default; a team only in Local.xcconfig, never in the repository.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: MussetReader
      - path: Shared
      - path: Musset/Resources/Localization
        type: folder
        buildPhase: resources
      - path: Musset/Resources/Fonts/EBGaramond-Regular.otf
        buildPhase: resources
      - path: Musset/Resources/Fonts/EBGaramond-Italic.otf
        buildPhase: resources
      - path: Musset/Resources/Fonts/EBGaramond-SemiBold.otf
        buildPhase: resources
      - path: Musset/Resources/Fonts/EBGaramond-SemiBoldItalic.otf
        buildPhase: resources
      - path: Musset/Resources/Fonts/EBGaramond-Bold.otf
        buildPhase: resources
      - path: Musset/Resources/Fonts/EBGaramond-BoldItalic.otf
        buildPhase: resources
      # The book's template: the reading engine sets the pages as the printed book's.
      - path: Musset/Resources/Typst/musset.typ
        buildPhase: resources
    dependencies:
      - package: MussetPage
    info:
      path: MussetReader/Info.plist
      properties:
        CFBundleDisplayName: Musset Reader
        UIAppFonts: [EBGaramond-Regular.otf, EBGaramond-Italic.otf]
        CFBundleURLTypes:
          - CFBundleURLName: app.musset.Reader
            CFBundleURLSchemes: [musset]
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
        # The App Store: version and build, the six languages of the tables, every orientation (asked of an iPad app).
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleLocalizations: [en, fr, de, es, it, pt-BR, pt-PT]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: MussetReader/MussetReader.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.musset.Reader
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Its own version: the Reader goes to the App Store on its own calendar.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
  MussetTests:
    type: bundle.unit-test
    platform: macOS
    sources: [MussetTests]
    dependencies:
      - target: Musset
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Puts the whole run in French, the language the tests expect (MussetTests/TestLanguage.swift).
        INFOPLIST_KEY_NSPrincipalClass: MussetTests.TestLanguage
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Musset.app/Contents/MacOS/Musset"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  MussetReader:
    build:
      targets:
        MussetReader: all
  Musset:
    build:
      targets:
        Musset: all
        MussetTests: [test]
    test:
      targets: [MussetTests]
