# Builds Musset and runs its tests on every push and pull request.
name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Tools
        run: brew install xcodegen typst
      - name: Rust
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Downloads cache (pandoc, LanguageTool, Java runtime)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Musset-build
          key: musset-build-${{ hashFiles('scripts/fetch-*.sh') }}
      - name: Reading engine
        run: scripts/build-typeset.sh --mac-only
      - name: Test
        run: |
          xcodegen generate
          set -o pipefail
          xcodebuild test -project Musset.xcodeproj -scheme Musset -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/ci CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= | tail -40
