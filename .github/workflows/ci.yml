# Builds Musset and runs its tests on every push and pull request.
name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The Xcode Musset is developed with, pinned: the newest "stable" on an older runner image lagged behind and
    # no longer compiled the app.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'
      - name: Tools
        run: brew install xcodegen typst
      - name: Rust
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Downloads cache (pandoc, LanguageTool, Java runtime)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Musset-build
          key: musset-build-${{ hashFiles('scripts/fetch-*.sh') }}
      - name: Reading engine
        run: scripts/build-typeset.sh --mac-only
      - name: Test
        # Under the job's limit, so a stuck run still fails here and leaves its log (a cancelled job keeps nothing).
        timeout-minutes: 45
        run: |
          xcodegen generate
          set -o pipefail
          # The whole log goes to a file; the page shows what matters: the compiler's errors, failed tests, the end.
          mkdir -p build
          status=0
          # A test that hangs (a fresh Mac has no first launch behind it, no CLI, no keychain item) fails after five minutes
          # with its name, and the others still run.
          xcodebuild test -project Musset.xcodeproj -scheme Musset -destination 'platform=macOS,arch=arm64' \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 300 \
            -derivedDataPath build/ci CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= > build/xcodebuild.log 2>&1 || status=$?
          grep -E "error:|' failed|exceeded|stalled|Executed [0-9]+ tests" build/xcodebuild.log | sort -u | head -80 || true
          tail -20 build/xcodebuild.log
          exit $status
      - name: Keep the full log
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
