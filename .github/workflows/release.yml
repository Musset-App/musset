# Releases Musset from a tag vX.Y.Z: built, signed with the project's Developer ID, notarized, uploaded to
# musset.app's downloads and announced in the Sparkle feed (scripts/release.sh). The tag's message becomes the
# release notes.
#
# Started by hand only (Actions ▸ Release ▸ Run workflow, with the tag). Releases are made from the author's Mac
# for now, and a tag also comes with every GitHub release: pushing one must not start a release that has no keys.
# To release from here on every tag again, add the secrets below and put back `push: tags: ["v*.*.*"]`.
#
# Secrets (repository settings ▸ Secrets and variables ▸ Actions):
#   MACOS_CERTIFICATE_P12        the Developer ID Application certificate and key, .p12, base64
#   MACOS_CERTIFICATE_PASSWORD   its password
#   MUSSET_SIGN_IDENTITY         "Developer ID Application: …"
#   NOTARY_KEY_P8                an App Store Connect API key (.p8 text) for notarization
#   NOTARY_KEY_ID, NOTARY_ISSUER its key id and issuer id
#   SPARKLE_PRIVATE_KEY          the Sparkle EdDSA private key (generate_keys -x)
#   CLOUDFLARE_API_TOKEN         a token that can write to R2
#   CLOUDFLARE_ACCOUNT_ID        the account holding the musset-downloads bucket
name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to release, e.g. v0.5.0"
        required: true
        type: string

jobs:
  release:
    # The Xcode Musset is developed with, pinned: the newest "stable" on an older runner image lagged behind and
    # no longer compiled the app.
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'
      - name: Tools
        run: brew install xcodegen typst
      - name: Rust
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Musset-build
          key: musset-build-${{ hashFiles('scripts/fetch-*.sh') }}
      - name: Reading engine
        run: scripts/build-typeset.sh --mac-only
      - name: Signing keychain
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/release.keychain-db"; PW="$(uuidgen)"
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 7200 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - name: Build the app once (SwiftPM fetches Sparkle's tools)
        run: |
          xcodegen generate
          xcodebuild -project Musset.xcodeproj -scheme Musset -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/release -configuration Release CODE_SIGNING_ALLOWED=NO -resolvePackageDependencies >/dev/null
      - name: Release
        env:
          MUSSET_SIGN_IDENTITY: ${{ secrets.MUSSET_SIGN_IDENTITY }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          MUSSET_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          MUSSET_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "not a version tag: $TAG" >&2; exit 1 ;; esac
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          export MUSSET_NOTARY_KEY="$RUNNER_TEMP/notary.p8" MUSSET_SPARKLE_KEY_FILE="$RUNNER_TEMP/sparkle.key"
          NOTES="$(git tag -l --format='%(contents)' "$TAG")"
          scripts/release.sh "${TAG#v}" "$NOTES"
      - name: Clean up
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/sparkle.key"
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
